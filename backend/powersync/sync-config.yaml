# Ce que chaque appareil reçoit (T-05) : les mêmes droits de lecture que les
# règles RLS de backend/supabase/migrations (fonctions is_table_member et
# can_read_character). Tout changement de l'un se reporte sur l'autre ;
# backend/powersync/tests/sync_test.sh le vérifie en CI.
config:
  edition: 3

streams:
  # Son profil, et ceux de ses partenaires de table.
  profils:
    auto_subscribe: true
    queries:
      - SELECT * FROM profile WHERE id = auth.user_id()
      - SELECT * FROM profile WHERE id IN (SELECT user_id FROM table_member WHERE table_id IN (SELECT table_id FROM table_member WHERE user_id = auth.user_id()))

  # Ses tables, leurs membres, packs et contenus interdits ; les invitations
  # au seul MJ.
  tables:
    auto_subscribe: true
    with:
      mes_tables: SELECT table_id FROM table_member WHERE user_id = auth.user_id()
    queries:
      - SELECT * FROM game_table WHERE gm_user_id = auth.user_id() OR id IN mes_tables
      - SELECT * FROM table_member WHERE table_id IN mes_tables
      - SELECT * FROM table_pack WHERE table_id IN mes_tables
      - SELECT * FROM table_banned_entity WHERE table_id IN mes_tables
      - SELECT * FROM table_activity WHERE table_id IN mes_tables
      - SELECT * FROM pc_slot WHERE table_id IN mes_tables
      - SELECT * FROM character_summary WHERE table_id IN mes_tables
      - SELECT * FROM table_invite WHERE table_id IN (SELECT id FROM game_table WHERE gm_user_id = auth.user_id())

  # Une fiche : son propriétaire, le MJ de sa table, et les membres quand la
  # table montre les fiches complètes. Son contenu suit.
  fiches:
    auto_subscribe: true
    with:
      fiches_lues: SELECT id FROM character WHERE owner_user_id = auth.user_id() OR table_id IN (SELECT id FROM game_table WHERE gm_user_id = auth.user_id()) OR table_id IN (SELECT id FROM game_table WHERE full_sheets_visible = true AND id IN (SELECT table_id FROM table_member WHERE user_id = auth.user_id()))
    queries:
      - SELECT * FROM character WHERE id IN fiches_lues
      - SELECT * FROM character_base_scores WHERE character_id IN fiches_lues
      - SELECT * FROM character_background_choice WHERE character_id IN fiches_lues
      - SELECT * FROM character_class_level WHERE character_id IN fiches_lues
      - SELECT * FROM character_feat WHERE character_id IN fiches_lues
      - SELECT * FROM character_weapon_mastery WHERE character_id IN fiches_lues
      - SELECT * FROM character_spell WHERE character_id IN fiches_lues
      - SELECT * FROM character_item WHERE character_id IN fiches_lues
      - SELECT * FROM character_state WHERE character_id IN fiches_lues
      - SELECT * FROM character_content_ref WHERE character_id IN fiches_lues
      - SELECT * FROM character_change_log WHERE character_id IN fiches_lues
      - SELECT * FROM character_language WHERE character_id IN fiches_lues
      - SELECT * FROM character_choice WHERE character_id IN fiches_lues

  # Propositions du MJ (US-34) : au propriétaire de la fiche et au MJ de sa
  # table, jamais aux autres membres.
  propositions:
    auto_subscribe: true
    queries:
      - SELECT * FROM character_proposal WHERE character_id IN (SELECT id FROM character WHERE owner_user_id = auth.user_id())
      - SELECT * FROM character_proposal WHERE table_id IN (SELECT id FROM game_table WHERE gm_user_id = auth.user_id())
