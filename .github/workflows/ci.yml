# Contrôles obligatoires sur chaque pull request (cahier §12.2, US-01).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Sur main, chaque fusion garde son run : on n'annule que les PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, analyse, tests, couverture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version de Flutter (.fvmrc)
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Melos
        run: |
          dart pub global activate melos 8.9.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - run: melos bootstrap
      - run: melos run format
      - run: melos run analyze
      - run: melos run test
      - run: melos run coverage

      - name: Publier la couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: packages/*/coverage/lcov.info
          if-no-files-found: ignore

  # Base locale sur le Web (SQLite WASM) : spec local-database, US-04 et
  # T-01 (stockage OPFS ou IndexedDB, 10 000 entités).
  web:
    name: Intégration Web (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chrome isolé
            browser: chrome
            args: >-
              --web-header=Cross-Origin-Opener-Policy=same-origin
              --web-header=Cross-Origin-Embedder-Policy=require-corp
              --dart-define=T01_EXPECTED_STORAGE=opfs
          - name: Chrome non isolé
            browser: chrome
            args: ""
          - name: Firefox
            browser: firefox
            args: ""
    env:
      BROWSER: ${{ matrix.browser }}
      DRIVE_ARGS: ${{ matrix.args }}
    steps:
      - uses: actions/checkout@v4

      - name: Version de Flutter (.fvmrc)
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - name: Pilote du navigateur
        run: |
          if [ "$BROWSER" = firefox ]; then
            "$GECKOWEBDRIVER/geckodriver" --port=4444 &
          else
            "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          fi
      - name: Tests d'intégration
        working-directory: apps/game_table
        run: |
          for target in database_test web_storage_test; do
            flutter drive -d web-server --profile --browser-name="$BROWSER" \
              $DRIVE_ARGS \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/$target.dart
          done
      - name: Mesures T01
        if: always()
        working-directory: apps/game_table
        run: cat build/integration_response_data.json || true

  # Safari (macOS) : T-01.
  safari:
    name: Intégration Web (Safari)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      BROWSER: safari
      DRIVE_ARGS: --no-headless
    steps:
      - uses: actions/checkout@v4

      - name: Version de Flutter (.fvmrc)
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - name: Pilote du navigateur
        run: |
          sudo safaridriver --enable
          safaridriver --port 4444 &
      - name: Tests d'intégration
        working-directory: apps/game_table
        run: |
          for target in database_test web_storage_test; do
            flutter drive -d web-server --profile --browser-name="$BROWSER" \
              $DRIVE_ARGS \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/$target.dart
          done
      - name: Mesures T01
        if: always()
        working-directory: apps/game_table
        run: cat build/integration_response_data.json || true

  # Base locale sur iOS (SQLite natif, simulateur) : spec local-database, US-04.
  ios:
    name: Intégration iOS (simulateur)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version de Flutter (.fvmrc)
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - name: Démarrer un simulateur iPhone
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = null ]; then
            echo "::error::Aucun simulateur iPhone disponible sur ce runner"
            exit 1
          fi
          xcrun simctl boot "$UDID"
          echo "SIMULATOR=$UDID" >> "$GITHUB_ENV"
      - name: Tests d'intégration
        working-directory: apps/game_table
        run: flutter test integration_test -d "$SIMULATOR"
