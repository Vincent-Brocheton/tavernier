# Contrôles obligatoires sur chaque pull request (cahier §12.2, US-01).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # Régénérer les images de référence des tests golden (Linux), publiées en
  # artefact « goldens » à commiter dans packages/dnd_ui_kit/test/golden/goldens.
  # Sur une pull request : étiquette « update-goldens », à retirer ensuite.
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Régénérer les références golden
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Une étiquette autre que « update-goldens » ne lance aucun job : son run
  # a son propre groupe, pour ne pas annuler le run utile en cours.
  group: >-
    ${{ github.event.action == 'labeled' && github.event.label.name != 'update-goldens'
    && format('ci-etiquette-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  # Sur main, chaque fusion garde son run : on n'annule que les PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, analyse, tests, couverture
    # Une étiquette ne relance la CI que si c'est « update-goldens ».
    if: github.event.action != 'labeled' || github.event.label.name == 'update-goldens'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version de Flutter (.fvmrc)
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Melos
        run: |
          dart pub global activate melos 8.9.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - run: melos bootstrap

      - name: Régénérer les références golden
        if: inputs.update_goldens || contains(github.event.pull_request.labels.*.name, 'update-goldens')
        working-directory: packages/dnd_ui_kit
        run: flutter test --update-goldens test/golden
      - name: Publier les références golden
        if: inputs.update_goldens || contains(github.event.pull_request.labels.*.name, 'update-goldens')
        uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: packages/dnd_ui_kit/test/golden/goldens/
      - name: Publier les écarts golden
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: echecs-golden
          path: packages/dnd_ui_kit/test/golden/failures/
          if-no-files-found: ignore
      - run: melos run format
      - run: melos run analyze
      - run: melos run test
      - run: melos run coverage

      - name: Publier la couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: packages/*/coverage/lcov.info
          if-no-files-found: ignore

  # Base locale sur le Web (SQLite WASM) : spec local-database, US-04 et
  # T-01 (stockage OPFS ou IndexedDB, 10 000 entités).
  supabase:
    name: Base Supabase (schéma, droits, synchronisation)
    # Une étiquette ne relance la CI que si c'est « update-goldens ».
    if: github.event.action != 'labeled' || github.event.label.name == 'update-goldens'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Supabase local dans Docker : migrations appliquées sur une base vierge,
      # puis tests pgTAP des droits (cahier §12.2).
      - name: Démarrer Supabase
        working-directory: backend
        run: supabase start
      - name: Migrations sur base vierge
        working-directory: backend
        run: supabase db reset
      - name: Tests des droits
        working-directory: backend
        run: supabase test db
      # PowerSync auto-hébergé sur le réseau Docker de Supabase local (T-05) :
      # rôle de réplication, base de stockage des buckets, puis le service.
      - name: Démarrer PowerSync
        working-directory: backend
        run: |
          eval "$(supabase status -o env | grep -E '^JWT_SECRET=')"
          docker exec -i supabase_db_tavernier psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role powersync_role with replication bypassrls login password 'powersync';
          grant select on all tables in schema public to powersync_role;
          create database powersync_storage owner powersync_role;
          SQL
          docker run -d --name powersync --network supabase_network_tavernier             -p 8080:8080 -v "$PWD/powersync:/config"             -e POWERSYNC_CONFIG_PATH=/config/service.yaml             -e PS_DATA_SOURCE_URI=postgresql://powersync_role:powersync@supabase_db_tavernier:5432/postgres             -e PS_STORAGE_URI=postgresql://powersync_role:powersync@supabase_db_tavernier:5432/powersync_storage             -e PS_JWKS_URI=http://supabase_kong_tavernier:8000/auth/v1/.well-known/jwks.json             -e PS_SUPABASE_JWT_SECRET="$JWT_SECRET"             journeyapps/powersync-service:latest start -r unified
          for _ in $(seq 60); do
            curl -sf http://localhost:8080/probes/liveness > /dev/null && exit 0
            sleep 2
          done
          docker logs powersync
          exit 1
      - name: Tests de synchronisation
        working-directory: backend
        run: bash powersync/tests/sync_test.sh
      - name: Journal de PowerSync
        if: failure()
        run: docker logs powersync 2>&1 | tail -200

  supabase-deploy:
    name: Migrations Supabase (projet hébergé)
    # Cahier §12.2 : les migrations ne sont appliquées que par la CI, après
    # leur passage sur base vierge, et seulement depuis main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: mtreifjwfadiyvatldux
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Secrets présents ?
        id: ready
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secrets Supabase absents : migrations non appliquées."
          fi
      - name: Appliquer les migrations
        if: steps.ready.outputs.ok == 'true'
        working-directory: backend
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"

  web:
    name: Intégration Web (${{ matrix.name }})
    # Une étiquette ne relance la CI que si c'est « update-goldens ».
    if: github.event.action != 'labeled' || github.event.label.name == 'update-goldens'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chrome isolé
            browser: chrome
            args: >-
              --web-header=Cross-Origin-Opener-Policy=same-origin
              --web-header=Cross-Origin-Embedder-Policy=require-corp
              --dart-define=T01_EXPECTED_STORAGE=opfs
          - name: Chrome non isolé
            browser: chrome
            args: ""
          - name: Firefox
            browser: firefox
            args: ""
    env:
      BROWSER: ${{ matrix.browser }}
      DRIVE_ARGS: ${{ matrix.args }}
    steps:
      - uses: actions/checkout@v4

      - name: Version de Flutter (.fvmrc)
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - name: Pilote du navigateur
        run: |
          if [ "$BROWSER" = firefox ]; then
            "$GECKOWEBDRIVER/geckodriver" --port=4444 &
          else
            "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          fi
      - name: Tests d'intégration
        working-directory: apps/game_table
        run: |
          for target in database_test web_storage_test m1_exit_test; do
            flutter drive -d web-server --profile --browser-name="$BROWSER" \
              $DRIVE_ARGS \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/$target.dart
          done
      - name: Mesures T01
        if: always()
        working-directory: apps/game_table
        run: cat build/integration_response_data.json || true

  # Safari (macOS) : T-01. Le stockage n'est pas imposé : le spike relève
  # celui que Safari choisit, avec et sans isolation.
  safari:
    name: Intégration Web (${{ matrix.name }})
    # Une étiquette ne relance la CI que si c'est « update-goldens ».
    if: github.event.action != 'labeled' || github.event.label.name == 'update-goldens'
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Safari isolé
            args: >-
              --web-header=Cross-Origin-Opener-Policy=same-origin
              --web-header=Cross-Origin-Embedder-Policy=require-corp
          - name: Safari non isolé
            args: ""
    env:
      BROWSER: safari
      DRIVE_ARGS: --no-headless ${{ matrix.args }}
    steps:
      - uses: actions/checkout@v4

      - name: Version de Flutter (.fvmrc)
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - name: Pilote du navigateur
        run: |
          sudo safaridriver --enable
          safaridriver --port 4444 &
      - name: Tests d'intégration
        working-directory: apps/game_table
        run: |
          for target in database_test web_storage_test m1_exit_test; do
            flutter drive -d web-server --profile --browser-name="$BROWSER" \
              $DRIVE_ARGS \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/$target.dart
          done
      - name: Mesures T01
        if: always()
        working-directory: apps/game_table
        run: cat build/integration_response_data.json || true
