# Contrôles obligatoires sur chaque pull request (cahier §12.2, US-01).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Sur main, chaque fusion garde son run : on n'annule que les PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, analyse, tests, couverture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version de Flutter (.fvmrc)
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Melos
        run: |
          dart pub global activate melos 8.9.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - run: melos bootstrap
      - run: melos run format
      - run: melos run analyze
      - run: melos run test
      - run: melos run coverage

      - name: Publier la couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: packages/*/coverage/lcov.info
          if-no-files-found: ignore

  # Base locale sur le Web (SQLite WASM) : spec local-database, US-04.
  web:
    name: Intégration Web (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version de Flutter (.fvmrc)
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - name: Test d'intégration
        working-directory: apps/game_table
        run: |
          chromedriver --port=4444 &
          flutter drive -d web-server --browser-name=chrome             --driver=test_driver/integration_test.dart             --target=integration_test/database_test.dart

  # Base locale sur iOS (SQLite natif, simulateur) : spec local-database, US-04.
  ios:
    name: Intégration iOS (simulateur)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version de Flutter (.fvmrc)
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - name: Démarrer un simulateur iPhone
        run: |
          UDID=$(xcrun simctl list devices available -j             | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = null ]; then
            echo "::error::Aucun simulateur iPhone disponible sur ce runner"
            exit 1
          fi
          xcrun simctl boot "$UDID"
          echo "SIMULATOR=$UDID" >> "$GITHUB_ENV"
      - name: Test d'intégration
        working-directory: apps/game_table
        run: flutter test integration_test/database_test.dart -d "$SIMULATOR"
