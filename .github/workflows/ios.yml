# Intégration iOS (simulateur), hors des contrôles obligatoires. À part de
# la CI : sur main, ses runs passent l'un après l'autre, et un job iOS lent y
# retenait le déploiement Supabase des fusions suivantes.
name: iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Seul le dernier commit compte : un nouveau run annule le précédent.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Base locale sur iOS (SQLite natif, simulateur) : spec local-database, US-04.
  ios:
    name: Intégration iOS (simulateur)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version de Flutter (.fvmrc)
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - name: Démarrer un simulateur iPhone
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = null ]; then
            echo "::error::Aucun simulateur iPhone disponible sur ce runner"
            exit 1
          fi
          xcrun simctl boot "$UDID"
          echo "SIMULATOR=$UDID" >> "$GITHUB_ENV"
      - name: Tests d'intégration
        working-directory: apps/game_table
        run: flutter test integration_test -d "$SIMULATOR"
