<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Notes — recherche plein texte (téléphone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--on-p:#00382F;--pc:#1F5047;--on-pc:#A6F2E0;--sc:#54463A;--on-sc:#F5E0C9;--t:#E7C28A;--tc:#5D4200;--on-tc:#FFDEA8;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--ol:#9C8E82;--olv:#4F453C}
*{box-sizing:border-box}
.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
mark{background:var(--tc);color:var(--on-tc);border-radius:3px;padding:0 2px}mark:empty{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex: none; padding: 12px 16px 8px; background: var(--sf-low)">
    <label style="height: 56px; border-radius: 28px; background: var(--sf-high); display: flex; align-items: center; gap: 4px; padding: 0 4px"><button aria-label="Retour" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M12 19l-7-7 7-7"></path></svg></button><input aria-label="Rechercher dans mes notes" value="sceau" style="flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px"><button aria-label="Effacer" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button></label>
    <div style="display: flex; gap: 8px; padding-top: 10px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4"><span aria-pressed="{{c.on}}" style="height: 32px; padding: 0 12px; border-radius: 8px; background: {{c.bg}}; color: {{c.fg}}; border: {{c.bd}}; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px">{{c.l}}<span class="n" style="font-size: 12px; color: {{c.cfg}}">{{c.c}}</span></span></sc-for>
    </div>
  </div>
  <span class="n" style="flex: none; padding: 12px 20px 4px; font-size: 12px; color: var(--on-sfv)">4 résultats · recherche hors-ligne dans les 14 notes de ce téléphone</span>
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{res}}" as="r" hint-placeholder-count="4">
      <a href="#" style="border-radius: 12px; background: var(--sf-c); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--on-sf)">
        <span style="display: flex; align-items: center; gap: 8px"><span style="flex: 1; font-size: 15px; font-weight: 500">{{r.tPre}}<mark>{{r.tHit}}</mark>{{r.tPost}}</span><span class="n" style="font-size: 12px; color: var(--on-sfv)">{{r.d}}</span></span>
        <span style="font-size: 14px; line-height: 20px; color: var(--on-sfv)">{{r.pre}}<mark>{{r.hit}}</mark>{{r.post}}</span>
        <span style="display: flex; gap: 6px; flex-wrap: wrap"><span style="height: 22px; padding: 0 6px; border-radius: 6px; background: var(--sf-highest); color: var(--on-sfv); font-size: 11px; font-weight: 500; display: inline-flex; align-items: center">{{r.scope}}</span><sc-if value="{{r.shared}}" hint-placeholder-val="{{false}}"><span style="height: 22px; padding: 0 6px; border-radius: 6px; background: var(--tc); color: var(--on-tc); font-size: 11px; font-weight: 500; display: inline-flex; align-items: center">{{r.sharedBy}}</span></sc-if></span>
      </a>
    </sc-for>
    <span style="font-size: 12px; line-height: 16px; color: var(--on-sfv); padding: 4px">La recherche ignore les accents et la casse : « Sceau », « sceaux » et « scéau » donnent les mêmes résultats.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (l, c, on) => ({ l, c, on: on ? 'true' : 'false', bg: on ? 'var(--sc)' : 'transparent', fg: on ? 'var(--on-sc)' : 'var(--on-sf)', cfg: on ? 'var(--on-sc)' : 'var(--on-sfv)', bd: on ? '1px solid var(--sc)' : '1px solid var(--ol)' });
    const chips = [chip('Toutes', 4, true), chip('Séances', 2), chip('PNJ', 1), chip('Table', 1)];
    const res = [
      { tPre: 'Ce que le loup portait', tHit: '', tPost: '', d: 'aujourd’hui', pre: 'Collier gravé d’un ', hit: 'sceau', post: ', le même que celui du chef bandit.', scope: 'Séance 11 · Le gué des Loups' },
      { tPre: 'Le ', tHit: 'sceau', tPost: ' de la Guilde', d: '9 oct.', pre: 'Je l’ai reconnu : ', hit: 'sceau', post: ' de la Guilde du Sel, trois vagues sous une couronne.', scope: 'Séance 9', shared: true, sharedBy: 'Partagée par Thalia (Léo)' },
      { tPre: 'Varga la Balafrée', tHit: '', tPost: '', d: '22 oct.', pre: '…elle portait le ', hit: 'sceau', post: ' au cou, caché sous sa cape.', scope: 'PNJ · Varga la Balafrée' },
      { tPre: 'Calendrier et factions', tHit: '', tPost: '', d: '12 oct.', pre: '…les péages sont marqués du ', hit: 'sceau', post: ' de la Guilde du Sel.', scope: 'Table', shared: true, sharedBy: 'Partagée par Camille (MJ)' },
    ];
    return { chips, res };
  }
}
</script>
</body>
</html>
