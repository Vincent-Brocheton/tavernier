<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Création 4 — Langues</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--on-p:#00382F;--pc:#1F5047;--on-pc:#A6F2E0;--sc:#54463A;--on-sc:#F5E0C9;--t:#E7C28A;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--ol:#9C8E82;--olv:#4F453C;--warn:#FFC266}
*{box-sizing:border-box}
.d{font-family:'Cinzel',Georgia,serif}
.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:#84D5C4}a:hover{color:#A6F2E0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="flex: none; position: relative; overflow: hidden; background: var(--sf-low)">
    <svg aria-hidden="true" width="390" height="140" style="position: absolute; inset: 0; opacity: 0.07; pointer-events: none"><filter id="gP04"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#gP04)"></rect></svg>
    <div style="position: relative; height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 4px">
      <button aria-label="Quitter la création" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button>
      <span style="flex: 1; font-size: 16px; font-weight: 500">Nouveau personnage</span>
      <span class="n" style="padding-right: 16px; font-size: 14px; color: var(--on-sfv)">Étape 4 sur 9</span>
    </div>
    <div role="progressbar" aria-valuemin="0" aria-valuemax="9" aria-valuenow="4" aria-label="Progression" style="position: relative; height: 4px; margin: 0 16px; display: flex; gap: 4px"><div style="width: 44.4%; height: 4px; border-radius: 2px; background: var(--p)"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: var(--sf-highest)"></div></div>
    <div style="position: relative; padding: 12px 16px 14px; display: flex; align-items: flex-end; gap: 12px">
      <div style="flex: 1">
        <h1 class="d" style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600; color: var(--t)">Langues</h1>
        <div style="font-size: 12px; line-height: 16px; color: var(--on-sfv)">Le commun, plus deux langues courantes.</div>
      </div>
      <span class="n" aria-live="polite" style="height: 32px; padding: 0 12px; border-radius: 16px; background: var(--sf-highest); display: inline-flex; align-items: center; font-size: 14px; font-weight: 600">1 / 2</span>
    </div>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 0 0; display: flex; flex-direction: column">
    <div style="min-height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 16px">
      <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 4px; background: rgba(237,224,214,0.38); color: var(--sf); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px">Commun</span><span style="font-size: 12px; color: var(--on-sfv)">Connu de tous les personnages</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D3C4B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Verrouillé" role="img"><path d="M5 11h14v10H5z M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    </div>
    <div style="display: flex; align-items: center; padding: 12px 16px 4px"><span style="flex: 1; font-size: 14px; font-weight: 500">Langues courantes</span><button style="height: 40px; padding: 0 12px; border-radius: 20px; color: var(--p); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8.7 5v10L12 22l-8.7-5V7z M12 2v20 M3.3 7l17.4 10 M20.7 7L3.3 17"></path></svg>Tirer au sort</button></div>
    <sc-for list="{{langs}}" as="l" hint-placeholder-count="9">
      <label style="min-height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 16px; cursor: pointer">
        <span style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center"><span style="width: 18px; height: 18px; border-radius: 2px; border: 2px solid {{l.bd}}; background: {{l.bg}}; color: var(--on-p); display: flex; align-items: center; justify-content: center"><sc-if value="{{l.on}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></sc-if></span></span>
        <input type="checkbox" aria-label="{{l.n}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">
        <span style="flex: 1; font-size: 16px">{{l.n}}</span>
        <span style="font-size: 12px; color: var(--on-sfv)">{{l.hint}}</span>
      </label>
    </sc-for>
    <div style="margin: 8px 16px 0; padding: 12px; border-radius: 12px; background: var(--sf-c); display: flex; gap: 10px; align-items: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D3C4B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 11h14v10H5z M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      <span style="font-size: 12px; line-height: 16px; color: var(--on-sfv)">Langues rares (abyssal, céleste, infernal…) : seulement via une aptitude qui les accorde.</span>
    </div>
  </div>

  <div style="flex: none; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 8px; background: var(--sf); box-shadow: 0 -1px 0 var(--olv)">
    <span style="font-size: 12px; color: var(--warn); display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 8v5 M12 16h.01"></path></svg>Choisissez encore 1 langue pour continuer.</span>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid var(--ol); font-size: 14px; font-weight: 500; color: var(--p)">Précédent</button>
      <button aria-disabled="true" style="flex: 1; height: 48px; border-radius: 24px; background: rgba(237,224,214,0.12); color: rgba(237,224,214,0.5); font-size: 14px; font-weight: 500; cursor: not-allowed">Suivant</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const L = ['Draconique', 'Elfique', 'Gigant', 'Gnome', 'Gobelin', 'Halfelin', 'Langue multiverselle des signes', 'Nain', 'Orc'];
    const langs = L.map((n) => {
      const on = n === 'Nain';
      return { n, on, bg: on ? 'var(--p)' : 'transparent', bd: on ? 'var(--p)' : 'var(--on-sfv)', hint: on ? 'Choisie' : '' };
    });
    return { langs };
  }
}
</script>
</body>
</html>
