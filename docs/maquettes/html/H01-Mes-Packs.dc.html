<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mes packs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--on-p:#00382F;--pc:#1F5047;--on-pc:#A6F2E0;--sc:#54463A;--on-sc:#F5E0C9;--t:#E7C28A;--tc:#5D4200;--on-tc:#FFDEA8;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--ol:#9C8E82;--olv:#4F453C;--warn:#FFC266;--warn-c:#634000;--on-warn-c:#FFDDB0;--thp-c:#1C4778;--on-thp-c:#D5E3FF}
*{box-sizing:border-box}
.d{font-family:'Cinzel',Georgia,serif}
.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:#84D5C4}a:hover{color:#A6F2E0}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-wrap: wrap">
  <nav aria-label="Navigation principale" style="flex: 0 0 80px; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; border-right: 1px solid var(--olv)">
    <sc-for list="{{rail}}" as="r" hint-placeholder-count="5">
      <a href="#" aria-current="{{r.cur}}" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--on-sf)"><span style="width: 56px; height: 32px; border-radius: 16px; background: {{r.bg}}; color: {{r.fg}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path></svg></span><span style="font-size: 12px; line-height: 16px; font-weight: {{r.w}}">{{r.l}}</span></a>
    </sc-for>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 32px">
      <h1 class="d" style="margin: 0; flex: 1; font-size: 28px; line-height: 36px; font-weight: 600; color: var(--t)">Homebrew</h1>
      <button style="height: 40px; padding: 0 16px 0 12px; border-radius: 20px; border: 1px solid var(--ol); color: var(--p); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3 M7 8l5-5 5 5 M5 21h14"></path></svg>Importer un .dndpack</button>
      <button style="height: 40px; padding: 0 20px 0 14px; border-radius: 20px; background: var(--p); color: var(--on-p); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg>Nouveau pack</button>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 4px 32px 32px; align-items: flex-start">
      <div style="flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <section style="display: flex; flex-direction: column; gap: 10px">
            <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 500">{{g.l}}</h2>
            <sc-for list="{{g.packs}}" as="p" hint-placeholder-count="2">
              <div style="border-radius: 16px; background: var(--sf-c); padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
                <span style="width: 48px; height: 48px; flex: none; border-radius: 12px; background: {{p.icBg}}; color: {{p.icFg}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.d}}"></path></svg></span>
                <span style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                  <span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span style="font-size: 16px; font-weight: 500">{{p.n}}</span><span class="n" style="height: 22px; padding: 0 6px; border-radius: 6px; background: var(--sf-highest); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">v{{p.v}}</span><sc-if value="{{p.hasBadge}}" hint-placeholder-val="{{false}}"><span style="height: 22px; padding: 0 6px; border-radius: 6px; background: {{p.bBg}}; color: {{p.bFg}}; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">{{p.badge}}</span></sc-if></span>
                  <span class="n" style="font-size: 13px; color: var(--on-sfv)">{{p.s}}</span>
                </span>
                <div style="display: flex; gap: 4px">
                  <sc-for list="{{p.actions}}" as="a" hint-placeholder-count="2"><button style="height: 40px; padding: 0 14px; border-radius: 20px; background: {{a.bg}}; color: {{a.fg}}; font-size: 13px; font-weight: 500">{{a.l}}</button></sc-for>
                </div>
              </div>
            </sc-for>
          </section>
        </sc-for>
      </div>

      <aside aria-label="Créer une entité" style="flex: 1 1 280px; max-width: 360px; min-width: 0; position: relative; overflow: hidden; border-radius: 16px; background: var(--sf-low); border: 1px solid var(--olv); padding: 18px; display: flex; flex-direction: column; gap: 12px">
        <svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; opacity: 0.07; pointer-events: none"><filter id="gH01"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#gH01)"></rect></svg>
        <h2 class="d" style="position: relative; margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; color: var(--t)">Créer une entité</h2>
        <span style="position: relative; font-size: 13px; line-height: 18px; color: var(--on-sfv)">Formulaires guidés, règles 2024 appliquées. Partez de zéro ou d’une entité du SRD.</span>
        <div style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{types}}" as="t" hint-placeholder-count="8"><button style="height: 56px; border-radius: 12px; background: var(--sf-c); padding: 0 12px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>{{t.l}}</button></sc-for>
        </div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const R = [
      ['Accueil', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z'],
      ['Tables', 'M3 21h18 M5 21V8l3-2 3 2v13 M13 21V5l3-2 3 2v16'],
      ['Personnages', 'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M4 21a8 8 0 0 1 16 0'],
      ['Compendium', 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'],
      ['Homebrew', 'M9 3h6 M10 3v6L4 19a1.5 1.5 0 0 0 1.3 2h13.4a1.5 1.5 0 0 0 1.3-2L14 9V3'],
    ];
    const rail = R.map(([l, d], i) => ({ l, d, cur: i === 4 ? 'page' : 'false', bg: i === 4 ? 'var(--sc)' : 'transparent', fg: i === 4 ? 'var(--on-sc)' : 'var(--on-sfv)', w: i === 4 ? 700 : 500 }));
    const FLASK = 'M9 3h6 M10 3v6L4 19a1.5 1.5 0 0 0 1.3 2h13.4a1.5 1.5 0 0 0 1.3-2L14 9V3', BOOK = 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z', DL = 'M12 3v12 M7 10l5 5 5-5 M5 21h14';
    const mine = { icBg: 'var(--tc)', icFg: 'var(--on-tc)', d: FLASK };
    const btn = (l, prim) => ({ l, bg: prim ? 'var(--sc)' : 'transparent', fg: prim ? 'var(--on-sc)' : 'var(--p)' });
    const groups = [
      { l: 'Mes packs', packs: [
        { n: 'Sorts d’Inès', v: '2.1.0', s: '18 sorts, 1 sous-classe · CC-BY-4.0 · active dans 3 tables', hasBadge: true, badge: 'Modifications non publiées', bBg: 'var(--warn-c)', bFg: 'var(--on-warn-c)', ...mine, actions: [btn('Exporter'), btn('Ouvrir', true)] },
        { n: 'Gardiens des Marches', v: '0.1.0', s: '1 sous-classe, 1 objet · brouillon · jamais publié', hasBadge: true, badge: 'Brouillon', bBg: 'var(--sf-highest)', bFg: 'var(--on-sfv)', ...mine, actions: [btn('Tester'), btn('Ouvrir', true)] },
      ] },
      { l: 'Importés', packs: [
        { n: 'Bestiaire des Marches', v: '1.3.0', s: 'par Camille · 42 monstres · CC-BY-4.0', hasBadge: true, badge: 'v1.4.0 reçue', bBg: 'var(--thp-c)', bFg: 'var(--on-thp-c)', icBg: 'var(--sf-highest)', icFg: 'var(--on-sf)', d: DL, actions: [btn('Dupliquer pour modifier'), btn('Voir la mise à jour', true)] },
      ] },
      { l: 'Inclus', packs: [
        { n: 'SRD 5.2.1', v: '5.2.1', s: 'Document de Référence du Système · CC-BY-4.0 · verrouillé', hasBadge: false, icBg: 'var(--sf-highest)', icFg: 'var(--on-sf)', d: BOOK, actions: [btn('Parcourir')] },
      ] },
    ];
    const types = [
      ['Don', 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z'],
      ['Historique', 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'],
      ['Espèce', 'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M4 21a8 8 0 0 1 16 0'],
      ['Classe', 'M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z'],
      ['Sous-classe', 'M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z M12 8v8 M8 12h8'],
      ['Sort', 'M12 2l1.8 4.6L18.5 8l-4.7 1.4L12 14l-1.8-4.6L5.5 8l4.7-1.4z M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z'],
      ['Objet', 'M14.5 17.5L3 6V3h3l11.5 11.5 M13 19l6-6 M16 16l4 4 M19 21l2-2'],
      ['Monstre', 'M5 9l2-5 3 4h4l3-4 2 5v5a7 7 0 0 1-14 0z M9.5 13h.01 M14.5 13h.01'],
    ].map(([l, d]) => ({ l, d }));
    return { rail, groups, types };
  }
}
</script>
</body>
</html>
