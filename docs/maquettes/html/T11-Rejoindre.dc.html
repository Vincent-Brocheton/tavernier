<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rejoindre une table — hors-ligne</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--on-p:#00382F;--pc:#1F5047;--on-pc:#A6F2E0;--sc:#54463A;--on-sc:#F5E0C9;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--ol:#9C8E82;--olv:#4F453C}
*{box-sizing:border-box}
.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:#84D5C4}a:hover{color:#A6F2E0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px">
    <button aria-label="Retour" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M12 19l-7-7 7-7"></path></svg></button>
    <h1 style="margin: 0; flex: 1; font-size: 22px; line-height: 28px; font-weight: 400">Rejoindre une table</h1>
  </header>

  <div role="alert" style="flex: none; margin: 0 16px; border-radius: 12px; background: var(--sf-high); padding: 12px; display: flex; gap: 10px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D3C4B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M3 3l18 18 M8 18a5 5 0 0 1-1.6-9.7 M10.5 6.3A6 6 0 0 1 18 9a4.5 4.5 0 0 1 2.4 8.3"></path></svg>
    <span style="font-size: 14px; line-height: 20px"><strong style="font-weight: 600">Pas de réseau.</strong> Rejoindre une table demande une connexion, une seule fois. Le code est gardé : la demande partira dès que le réseau revient.</span>
  </div>

  <div style="flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px">
    <button style="height: 200px; border-radius: 16px; background: var(--sf-c); border: 1px solid var(--olv); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--on-sfv)">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V3h4 M17 3h4v4 M21 17v4h-4 M7 21H3v-4 M7 7h4v4H7z M13 13h4v4h-4z M13 7h4 M7 15v2"></path></svg>
      <span style="font-size: 15px; color: var(--on-sf)">Scanner le QR du MJ</span>
    </button>

    <div style="display: flex; align-items: center; gap: 12px; color: var(--on-sfv); font-size: 12px"><span style="flex: 1; height: 1px; background: var(--olv)"></span>ou saisir le code<span style="flex: 1; height: 1px; background: var(--olv)"></span></div>

    <div role="group" aria-label="Code à 6 caractères" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{code}}" as="c" hint-placeholder-count="6">
        <span class="n" style="height: 56px; border-radius: 8px; border: 1px solid var(--ol); background: var(--sf-c); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600">{{c}}</span>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <button style="height: 48px; border-radius: 24px; background: var(--sc); color: var(--on-sc); font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v5l3 2"></path></svg>En attente du réseau…</button>
      <span style="text-align: center; font-size: 12px; color: var(--on-sfv)">En attendant, vous pouvez créer un personnage libre.</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { code: ['K', '7', 'Q', '4', 'Z', 'P'] }; }
}
</script>
</body>
</html>
