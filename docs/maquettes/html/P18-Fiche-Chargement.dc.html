<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fiche — chargement</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--olv:#4F453C}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
@keyframes sk{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.sk{animation:sk 1.6s ease-in-out infinite}
.bar{animation:bar 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.sk,.bar{animation:none}}
a{color:#84D5C4}a:hover{color:#A6F2E0}
</style>
</helmet>
<div aria-busy="true" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px; background: var(--sf-low)">
    <button aria-label="Retour" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M12 19l-7-7 7-7"></path></svg></button>
    <span style="flex: 1; font-size: 16px; font-weight: 500">Fiche</span>
  </header>
  <div role="progressbar" aria-label="Chargement de la fiche" style="flex: none; height: 4px; background: var(--sf-highest); overflow: hidden"><div class="bar" style="width: 40%; height: 4px; border-radius: 2px; background: var(--p)"></div></div>

  <div style="flex: none; background: var(--sf-low); padding: 16px; display: flex; gap: 14px; align-items: center">
    <div class="sk" style="width: 64px; height: 64px; border-radius: 32px; background: var(--sf-highest)"></div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 8px"><div class="sk" style="width: 70%; height: 22px; border-radius: 6px; background: var(--sf-highest)"></div><div class="sk" style="width: 90%; height: 14px; border-radius: 6px; background: var(--sf-highest)"></div></div>
  </div>
  <div style="flex: none; height: 48px; background: var(--sf-low); border-bottom: 1px solid var(--olv); display: flex; align-items: center; gap: 24px; padding: 0 16px"><div class="sk" style="width: 64px; height: 12px; border-radius: 6px; background: var(--sf-highest)"></div><div class="sk" style="width: 80px; height: 12px; border-radius: 6px; background: var(--sf-highest)"></div><div class="sk" style="width: 56px; height: 12px; border-radius: 6px; background: var(--sf-highest)"></div></div>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div class="sk" style="height: 150px; border-radius: 16px; background: var(--sf-c)"></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div class="sk" style="height: 72px; border-radius: 12px; background: var(--sf-c)"></div><div class="sk" style="height: 72px; border-radius: 12px; background: var(--sf-c)"></div><div class="sk" style="height: 72px; border-radius: 12px; background: var(--sf-c)"></div>
      <div class="sk" style="height: 72px; border-radius: 12px; background: var(--sf-c)"></div><div class="sk" style="height: 72px; border-radius: 12px; background: var(--sf-c)"></div><div class="sk" style="height: 72px; border-radius: 12px; background: var(--sf-c)"></div>
    </div>
    <p role="status" style="margin: 8px 0 0; text-align: center; font-size: 13px; line-height: 18px; color: var(--on-sfv)">Ouverture du pack « Les Marches v1.3 » et calcul des valeurs…<br>Ensuite, tout fonctionne sans réseau.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
