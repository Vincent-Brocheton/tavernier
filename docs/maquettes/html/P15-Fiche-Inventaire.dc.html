<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fiche — Inventaire</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--on-p:#00382F;--pc:#1F5047;--on-pc:#A6F2E0;--sc:#54463A;--on-sc:#F5E0C9;--t:#E7C28A;--tc:#5D4200;--on-tc:#FFDEA8;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--ol:#9C8E82;--olv:#4F453C}
*{box-sizing:border-box}
.d{font-family:'Cinzel',Georgia,serif}
.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:#84D5C4}a:hover{color:#A6F2E0}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px; background: var(--sf-low)">
    <button aria-label="Retour" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M12 19l-7-7 7-7"></path></svg></button>
    <span class="d" style="flex: 1; font-size: 20px; font-weight: 600; color: var(--t)">Aldric Varenne</span>
    <button aria-label="Plus d’options" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5h.01 M12 12h.01 M12 19h.01"></path></svg></button>
  </header>
  <nav aria-label="Onglets de la fiche" style="flex: none; height: 48px; display: flex; background: var(--sf-low); border-bottom: 1px solid var(--olv); overflow: hidden; margin-left: -120px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
      <a href="#" aria-current="{{t.cur}}" style="flex: none; height: 48px; padding: 0 14px; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: {{t.fg}}; font-size: 14px; font-weight: 500"><span style="flex: 1; display: flex; align-items: center">{{t.l}}</span><span style="height: 3px; width: 100%; border-radius: 3px 3px 0 0; background: {{t.bar}}"></span></a>
    </sc-for>
  </nav>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <section aria-label="Monnaie" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{coins}}" as="c" hint-placeholder-count="5">
        <button style="height: 64px; border-radius: 12px; background: var(--sf-c); display: flex; flex-direction: column; align-items: center; justify-content: center"><span class="n" style="font-size: 18px; font-weight: 600; color: {{c.fg}}">{{c.v}}</span><span style="font-size: 11px; color: var(--on-sfv)">{{c.l}}</span></button>
      </sc-for>
    </section>

    <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px">
      <span style="flex: 1; font-size: 14px; font-weight: 500">Harmonisation</span>
      <span style="display: flex; gap: 6px" aria-label="0 objet harmonisé sur 3"><span style="width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--t)"></span><span style="width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--t)"></span><span style="width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--t)"></span></span>
      <span class="n" style="font-size: 13px; color: var(--on-sfv)">0 / 3</span>
    </div>

    <section aria-label="Équipé" style="border-radius: 16px; background: var(--sf-c); padding: 4px 0">
      <div style="padding: 10px 16px 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; color: var(--on-sfv)">ÉQUIPÉ</div>
      <sc-for list="{{worn}}" as="i" hint-placeholder-count="3">
        <div style="min-height: 56px; padding: 6px 8px 6px 16px; display: flex; align-items: center; gap: 12px">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px">{{i.n}}</span><span class="n" style="font-size: 12px; color: var(--on-sfv)">{{i.s}}</span></span>
          <button role="switch" aria-checked="true" aria-label="Équipé : {{i.n}}" style="width: 52px; height: 32px; border-radius: 16px; background: var(--p); display: flex; align-items: center; justify-content: flex-end; padding: 0 4px"><span style="width: 24px; height: 24px; border-radius: 12px; background: var(--on-p); color: var(--p); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span></button>
        </div>
      </sc-for>
    </section>

    <section aria-label="Objet magique" style="border-radius: 16px; background: var(--sf-c); padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 0 1px var(--tc)">
      <div style="display: flex; align-items: center; gap: 8px"><span style="flex: 1; font-size: 15px; font-weight: 500">Cape de protection</span><span style="height: 22px; padding: 0 6px; border-radius: 6px; background: var(--tc); color: var(--on-tc); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">Harmonisation requise</span></div>
      <span style="font-size: 13px; line-height: 18px; color: var(--on-sfv)">+1 à la CA et aux jets de sauvegarde, une fois harmonisée et portée.</span>
      <div style="display: flex; align-items: center; gap: 8px">
        <span class="n" style="flex: 1; font-size: 13px">Aperçu : CA <strong>19 → 20</strong> · JS <strong>+1</strong></span>
        <button style="height: 40px; padding: 0 16px; border-radius: 20px; background: var(--sc); color: var(--on-sc); font-size: 14px; font-weight: 500">S’harmoniser</button>
      </div>
    </section>

    <section aria-label="Sac" style="border-radius: 16px; background: var(--sf-c); padding: 4px 0">
      <div style="padding: 10px 16px 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; color: var(--on-sfv)">SAC</div>
      <sc-for list="{{bag}}" as="i" hint-placeholder-count="6">
        <div style="min-height: 48px; padding: 0 8px 0 16px; display: flex; align-items: center; gap: 12px">
          <span style="flex: 1; font-size: 15px">{{i.n}}</span>
          <span class="n" style="min-width: 32px; height: 28px; padding: 0 8px; border-radius: 14px; background: var(--sf-highest); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">×{{i.q}}</span>
          <sc-if value="{{i.use}}" hint-placeholder-val="{{false}}"><button aria-label="Utiliser : {{i.n}}" style="height: 36px; padding: 0 14px; border-radius: 18px; background: var(--sc); color: var(--on-sc); font-size: 13px; font-weight: 500">Utiliser</button></sc-if>
          <button aria-label="Actions pour {{i.n}}" style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5h.01 M12 12h.01 M12 19h.01"></path></svg></button>
        </div>
      </sc-for>
    </section>
  </div>

  <button style="position: absolute; right: 16px; bottom: 24px; height: 56px; padding: 0 20px 0 16px; border-radius: 16px; background: var(--pc); color: var(--on-pc); display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,.45)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg>Ajouter un objet</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const tabs = ['Principal', 'Compétences', 'Combat', 'Sorts', 'Inventaire', 'Aptitudes', 'Notes'].map((l, i) => ({ l, cur: i === 4 ? 'page' : 'false', fg: i === 4 ? 'var(--p)' : 'var(--on-sfv)', bar: i === 4 ? 'var(--p)' : 'transparent' }));
    const coins = [['pp', 0], ['po', 46], ['pe', 0], ['pa', 12], ['pc', 30]].map(([l, v]) => ({ l, v, fg: v ? 'var(--on-sf)' : 'var(--on-sfv)' }));
    const worn = [
      { n: 'Cotte de mailles', s: 'Armure lourde · CA 16 · FOR 13 requise' },
      { n: 'Bouclier', s: '+2 à la CA' },
      { n: 'Épée longue', s: '+7 · 1d8 + 4 tranchants · botte Sape' },
    ];
    const bag = [
      { n: 'Javeline', q: 4 }, { n: 'Hache d’armes', q: 1 }, { n: 'Potion de guérison', q: 2, use: true },
      { n: 'Trousse de soins', q: 1, use: true }, { n: 'Dés', q: 1 }, { n: 'Paquetage d’exploration souterraine', q: 1 },
    ];
    return { tabs, coins, worn, bag };
  }
}
</script>
</body>
</html>
