<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Séance en cours — MJ, hors-ligne (téléphone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--on-p:#00382F;--pc:#1F5047;--on-pc:#A6F2E0;--sc:#54463A;--on-sc:#F5E0C9;--t:#E7C28A;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--ol:#9C8E82;--olv:#4F453C;--dmg:#FF9F8F;--dmg-c:#73241B;--on-dmg-c:#FFDAD3;--heal:#9ED98C;--heal-c:#24501C;--on-heal-c:#BAF5A6;--warn:#FFC266;--warn-c:#634000;--on-warn-c:#FFDDB0}
*{box-sizing:border-box}
.d{font-family:'Cinzel',Georgia,serif}
.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="position: relative; overflow: hidden; flex: none; background: #2F4A3E; padding: 8px 4px 12px; display: flex; align-items: center; gap: 4px">
    <svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; opacity: 0.16; pointer-events: none"><filter id="gS03"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#gS03)"></rect></svg>
    <button aria-label="Retour à la table" style="position: relative; width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M12 19l-7-7 7-7"></path></svg></button>
    <div style="position: relative; flex: 1; display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.5px; color: var(--on-pc)">SÉANCE 12 · EN COURS</span><span class="d" style="font-size: 20px; line-height: 26px; font-weight: 600; color: var(--t)">Le relais du Sel</span></div>
    <span aria-label="Hors-ligne" style="position: relative; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--on-pc)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18 M8.5 8.6A5 5 0 0 0 7 18h10.5 M11 5.1A6 6 0 0 1 18 9a4.5 4.5 0 0 1 2.9 7.9"></path></svg></span>
  </header>
  <div role="status" class="n" style="flex: none; background: var(--sf-highest); padding: 8px 16px; font-size: 13px; line-height: 18px">Hors-ligne depuis 21:12. Tout fonctionne ; 37 actions partiront au retour du réseau.</div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.5px; color: var(--on-sfv)">RENCONTRES</span>
    <sc-for list="{{enc}}" as="e" hint-placeholder-count="3">
      <div style="border-radius: 12px; background: {{e.bg}}; border: {{e.bd}}; padding: 10px 10px 10px 14px; display: flex; align-items: center; gap: 12px">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{e.n}}</span><span class="n" style="font-size: 12px; color: var(--on-sfv)">{{e.s}}</span></span>
        <sc-if value="{{e.go}}" hint-placeholder-val="{{false}}"><button style="height: 40px; padding: 0 18px; border-radius: 20px; background: var(--p); color: var(--on-p); font-size: 14px; font-weight: 600">Lancer</button></sc-if>
        <sc-if value="{{e.tag}}" hint-placeholder-val="{{true}}"><span style="height: 22px; padding: 0 8px; border-radius: 6px; background: {{e.tagBg}}; color: {{e.tagFg}}; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">{{e.tag}}</span></sc-if>
      </div>
    </sc-for>

    <div style="margin-top: 4px; display: flex; align-items: center; gap: 8px"><span style="flex: 1; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; color: var(--on-sfv)">GROUPE</span><button style="height: 40px; padding: 0 14px 0 10px; border-radius: 20px; background: var(--sc); color: var(--on-sc); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>Repos du groupe…</button></div>
    <div style="border-radius: 12px; background: var(--sf-c); padding: 4px 0">
      <sc-for list="{{pcs}}" as="c" hint-placeholder-count="4">
        <div style="min-height: 52px; padding: 6px 14px; display: flex; flex-direction: column; gap: 6px; justify-content: center">
          <span style="display: flex; align-items: center; gap: 8px"><span style="flex: 1; font-size: 14px">{{c.n}}</span><sc-if value="{{c.tag}}" hint-placeholder-val="{{false}}"><span style="height: 20px; padding: 0 6px; border-radius: 5px; background: var(--dmg-c); color: var(--on-dmg-c); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">{{c.tag}}</span></sc-if><span class="n" style="font-size: 14px; font-weight: 600">{{c.hp}}</span><span class="n" style="font-size: 12px; color: var(--on-sfv)">/ {{c.max}}</span></span>
          <span role="meter" aria-label="{{c.aria}}" style="height: 6px; border-radius: 3px; background: var(--sf-highest); overflow: hidden"><span style="display: block; height: 100%; width: {{c.pct}}; background: {{c.bar}}"></span></span>
        </div>
      </sc-for>
    </div>

    <label style="flex: none; min-height: 56px; border-radius: 28px; background: var(--sf-high); display: flex; align-items: center; gap: 8px; padding: 0 6px 0 16px; margin-top: 4px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg><input aria-label="Note rapide" placeholder="Note rapide pour la séance…" style="flex: 1; border: 0; outline: 0; background: transparent; font-size: 15px"><button aria-label="Enregistrer la note" style="width: 44px; height: 44px; border-radius: 22px; background: var(--sc); color: var(--on-sc); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></button></label>
  </div>

  <div style="flex: none; padding: 8px 16px 20px; display: flex; gap: 8px; border-top: 1px solid var(--olv); background: var(--sf-low)">
    <button style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid var(--ol); color: var(--p); font-size: 14px; font-weight: 500">Notes (3)</button>
    <button style="flex: 1; height: 48px; border-radius: 24px; background: var(--sc); color: var(--on-sc); font-size: 14px; font-weight: 500">Clore la séance</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const enc = [
      { n: 'Embuscade sur la route', s: '4 rounds · 300 PX · 8 / 8 adversaires tombés', tag: 'Terminée', tagBg: 'var(--sf-highest)', tagFg: 'var(--on-sfv)', go: false, bg: 'var(--sf-c)', bd: '0' },
      { n: 'Le relais du Sel', s: '11 adversaires · 3 000 PX · modérée', tag: '', go: true, bg: 'var(--sf-high)', bd: '1px solid var(--p)' },
      { n: 'Les chiens de Varga', s: 'Option · 400 PX', tag: 'Option', tagBg: 'var(--sf-highest)', tagFg: 'var(--on-sfv)', go: false, bg: 'var(--sf-c)', bd: '0' },
    ];
    const col = (r) => (r > 0.5 ? 'var(--heal)' : r > 0.25 ? 'var(--warn)' : 'var(--dmg)');
    const pc = (n, hp, max, tag) => ({ n, hp, max, tag: tag || '', pct: Math.round((hp / max) * 100) + '%', bar: col(hp / max), aria: n + ' : ' + hp + ' PV sur ' + max });
    const pcs = [pc('Aldric Varenne', 41, 49), pc('Mira Solen', 10, 38), pc('Thalia', 33, 33), pc('Brannoc', 3, 27)];
    return { enc, pcs };
  }
}
</script>
</body>
</html>
