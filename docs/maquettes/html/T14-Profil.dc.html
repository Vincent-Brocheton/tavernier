<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Profil et réglages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--on-p:#00382F;--pc:#1F5047;--on-pc:#A6F2E0;--sc:#54463A;--on-sc:#F5E0C9;--t:#E7C28A;--e:#FFB4AB;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--ol:#9C8E82;--olv:#4F453C}
*{box-sizing:border-box}
.d{font-family:'Cinzel',Georgia,serif}
.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:#84D5C4}a:hover{color:#A6F2E0}
</style>
</helmet>
<div style="width: 390px; height: 1100px; position: relative; overflow: hidden; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px">
    <button aria-label="Retour" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M12 19l-7-7 7-7"></path></svg></button>
    <h1 style="margin: 0; flex: 1; font-size: 22px; line-height: 28px; font-weight: 400">Profil et réglages</h1>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 16px; padding: 8px 0">
      <button aria-label="Changer d’avatar" style="width: 64px; height: 64px; border-radius: 32px; background: var(--sc); color: var(--on-sc); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600">H</button>
      <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 500">Hugo</span><span style="font-size: 13px; color: var(--on-sfv)">hugo@exemple.fr</span></div>
      <button style="height: 40px; padding: 0 12px; border-radius: 20px; color: var(--p); font-size: 14px; font-weight: 500">Modifier</button>
    </div>

    <section aria-label="Affichage" style="border-radius: 16px; background: var(--sf-c); padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 10px 0 0; font-size: 14px; line-height: 20px; font-weight: 500">Affichage</h2>
      <div style="min-height: 48px; display: flex; align-items: center; gap: 12px"><span style="flex: 1; font-size: 15px">Langue</span><span style="font-size: 14px; color: var(--on-sfv)">Français</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center"><span style="flex: 1; font-size: 15px">Taille du texte</span><span class="n" style="font-size: 14px; font-weight: 600">100 %</span></div>
        <div role="slider" aria-label="Taille du texte" aria-valuemin="85" aria-valuemax="200" aria-valuenow="100" tabindex="0" style="position: relative; height: 44px; display: flex; align-items: center">
          <div style="position: absolute; left: 0; right: 0; height: 16px; border-radius: 8px; background: var(--sf-highest)"></div>
          <div style="position: absolute; left: 0; width: 13%; height: 16px; border-radius: 8px 2px 2px 8px; background: var(--p)"></div>
          <div style="position: absolute; left: calc(13% + 2px); width: 4px; height: 44px; border-radius: 2px; background: var(--p)"></div>
        </div>
        <div class="n" style="display: flex; justify-content: space-between; font-size: 11px; color: var(--on-sfv)"><span>85 %</span><span>200 %</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 15px">Thème</span>
        <div role="radiogroup" aria-label="Thème" style="display: flex; height: 40px; border-radius: 20px; border: 1px solid var(--ol); overflow: hidden">
          <button role="radio" aria-checked="true" style="flex: 1; background: var(--sc); color: var(--on-sc); font-size: 14px; font-weight: 500">Sombre</button>
          <button role="radio" aria-checked="false" aria-disabled="true" style="flex: 1; border-left: 1px solid var(--ol); font-size: 14px; font-weight: 500; color: rgba(237,224,214,0.38); cursor: not-allowed">Clair</button>
          <button role="radio" aria-checked="false" aria-disabled="true" style="flex: 1; border-left: 1px solid var(--ol); font-size: 14px; font-weight: 500; color: rgba(237,224,214,0.38); cursor: not-allowed">Système</button>
        </div>
        <span style="font-size: 12px; color: var(--on-sfv)">Le thème clair arrive dans une prochaine version.</span>
      </div>
    </section>

    <section aria-label="Confidentialité" style="border-radius: 16px; background: var(--sf-c); padding: 4px 16px">
      <div style="min-height: 64px; display: flex; align-items: center; gap: 12px">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px">Rapports de plantage</span><span style="font-size: 12px; line-height: 16px; color: var(--on-sfv)">Sans données de jeu ni contenu personnel</span></span>
        <button role="switch" aria-checked="true" aria-label="Rapports de plantage" style="width: 52px; height: 32px; border-radius: 16px; background: var(--p); display: flex; align-items: center; justify-content: flex-end; padding: 0 4px"><span style="width: 24px; height: 24px; border-radius: 12px; background: var(--on-p)"></span></button>
      </div>
    </section>

    <section aria-label="Appareils connectés" style="border-radius: 16px; background: var(--sf-c); padding: 4px 0">
      <h2 style="margin: 10px 16px 4px; font-size: 14px; line-height: 20px; font-weight: 500">Appareils connectés</h2>
      <sc-for list="{{devices}}" as="d" hint-placeholder-count="3">
        <div style="min-height: 64px; padding: 4px 8px 4px 16px; display: flex; align-items: center; gap: 12px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px">{{d.n}}</span><span style="font-size: 12px; color: var(--on-sfv)">{{d.s}}</span></span>
          <sc-if value="{{d.canKick}}" hint-placeholder-val="{{true}}"><button style="height: 40px; padding: 0 12px; border-radius: 20px; color: var(--p); font-size: 14px; font-weight: 500">Déconnecter</button></sc-if>
        </div>
      </sc-for>
    </section>

    <section aria-label="Données" style="border-radius: 16px; background: var(--sf-c); padding: 4px 0">
      <h2 style="margin: 10px 16px 4px; font-size: 14px; line-height: 20px; font-weight: 500">Mes données</h2>
      <button style="width: 100%; min-height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-align: left"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px">Exporter toutes mes données</span><span style="font-size: 12px; color: var(--on-sfv)">Fichier JSON : fiches, tables, packs, notes</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12 M7 10l5 5 5-5 M5 21h14"></path></svg></button>
      <button style="width: 100%; min-height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-align: left"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px">Sauvegarde locale</span><span class="n" style="font-size: 12px; color: var(--on-sfv)">Dernière synchronisation : il y a 3 min</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
      <button style="width: 100%; min-height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-align: left; color: var(--e)"><span style="flex: 1; font-size: 15px">Supprimer mon compte</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    </section>
    <button style="align-self: center; height: 40px; padding: 0 16px; border-radius: 20px; color: var(--p); font-size: 14px; font-weight: 500">Se déconnecter</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const phone = 'M7 2h10v20H7z M11 18h2', pc = 'M3 4h18v12H3z M8 20h8 M12 16v4';
    return { devices: [
      { n: 'Téléphone Android', s: 'Cet appareil · actif maintenant', icon: phone, canKick: false },
      { n: 'Chrome sur Windows', s: 'Il y a 2 jours', icon: pc, canKick: true },
      { n: 'Tablette', s: 'Il y a 3 semaines', icon: phone, canKick: true },
    ] };
  }
}
</script>
</body>
</html>
