<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fiche — Sorts, état vide</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--on-p:#00382F;--pc:#1F5047;--on-pc:#A6F2E0;--sc:#54463A;--on-sc:#F5E0C9;--t:#E7C28A;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--ol:#9C8E82;--olv:#4F453C}
*{box-sizing:border-box}
.d{font-family:'Cinzel',Georgia,serif}
.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:#84D5C4}a:hover{color:#A6F2E0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px; background: var(--sf-low)">
    <button aria-label="Retour" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M12 19l-7-7 7-7"></path></svg></button>
    <span class="d" style="flex: 1; font-size: 20px; font-weight: 600; color: var(--t)">Aldric Varenne</span>
  </header>
  <nav aria-label="Onglets de la fiche" style="flex: none; height: 48px; display: flex; background: var(--sf-low); border-bottom: 1px solid var(--olv); overflow: hidden; margin-left: -60px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
      <a href="#" aria-current="{{t.cur}}" style="flex: none; height: 48px; padding: 0 14px; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: {{t.fg}}; font-size: 14px; font-weight: 500"><span style="flex: 1; display: flex; align-items: center">{{t.l}}</span><span style="height: 3px; width: 100%; border-radius: 3px 3px 0 0; background: {{t.bar}}"></span></a>
    </sc-for>
  </nav>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 32px; text-align: center">
    <div aria-hidden="true" style="width: 112px; height: 112px; border-radius: 56px; background: var(--sf-c); display: flex; align-items: center; justify-content: center; color: var(--t)">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z M12 6l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"></path></svg>
    </div>
    <h2 class="d" style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; color: var(--t)">Aucun sort</h2>
    <p style="margin: 0; max-width: 280px; font-size: 14px; line-height: 20px; color: var(--on-sfv)">Le Guerrier Champion ne lance pas de sorts. Le don Initié à la magie, pris à une prochaine Amélioration de caractéristique, vous en donnerait.</p>
    <a href="#" style="height: 40px; padding: 0 20px; border-radius: 20px; background: var(--sc); color: var(--on-sc); display: inline-flex; align-items: center; font-size: 14px; font-weight: 500; text-decoration: none">Voir le don dans le compendium</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tabs = ['Principal', 'Compétences', 'Combat', 'Sorts', 'Inventaire', 'Aptitudes', 'Notes'].map((l, i) => ({ l, cur: i === 3 ? 'page' : 'false', fg: i === 3 ? 'var(--p)' : 'var(--on-sfv)', bar: i === 3 ? 'var(--p)' : 'transparent' }));
    return { tabs };
  }
}
</script>
</body>
</html>
