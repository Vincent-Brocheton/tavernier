<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil — premier usage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--on-p:#00382F;--pc:#1F5047;--on-pc:#A6F2E0;--sc:#54463A;--on-sc:#F5E0C9;--t:#E7C28A;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--ol:#9C8E82;--olv:#4F453C}
*{box-sizing:border-box}
.d{font-family:'Cinzel',Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:#84D5C4}a:hover{color:#A6F2E0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 16px">
    <h1 class="d" style="margin: 0; flex: 1; font-size: 22px; line-height: 28px; font-weight: 600; color: var(--t)">Accueil</h1>
    <span aria-label="Synchronisé" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9ED98C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a5 5 0 0 1-.5-9.98A6 6 0 0 1 18 9a4.5 4.5 0 0 1 0 9z M9.5 13.5l2 2 3.5-3.5"></path></svg></span>
    <button aria-label="Profil et réglages" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span style="width: 32px; height: 32px; border-radius: 16px; background: var(--sc); color: var(--on-sc); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">H</span></button>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 20px">
    <section aria-label="Mes tables" style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 500">Mes tables</h2>
      <div style="position: relative; overflow: hidden; border-radius: 16px; background: var(--sf-low); border: 1px dashed var(--ol); padding: 24px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
        <svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; opacity: 0.07; pointer-events: none"><filter id="gT04"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#gT04)"></rect></svg>
        <svg style="position: relative" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#E7C28A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18 M5 21V8l3-2 3 2v13 M13 21V5l3-2 3 2v16"></path></svg>
        <p style="position: relative; margin: 0; font-size: 14px; line-height: 20px; color: var(--on-sfv)">Aucune table pour l’instant. Votre MJ vous a envoyé un lien, un code ou un QR ?</p>
        <div style="position: relative; display: flex; gap: 8px">
          <button style="height: 40px; padding: 0 20px; border-radius: 20px; background: var(--p); color: var(--on-p); font-size: 14px; font-weight: 600">Rejoindre</button>
          <button style="height: 40px; padding: 0 20px; border-radius: 20px; border: 1px solid var(--ol); color: var(--p); font-size: 14px; font-weight: 500">Créer une table</button>
        </div>
      </div>
    </section>

    <section aria-label="Mes personnages" style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 500">Mes personnages</h2>
      <button style="min-height: 72px; border-radius: 16px; background: var(--sf-c); padding: 12px 16px; display: flex; align-items: center; gap: 16px; text-align: left">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: var(--pc); color: var(--on-pc); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px">Créer un personnage libre</span><span style="font-size: 12px; line-height: 16px; color: var(--on-sfv)">Sans table, sans réseau. À rattacher plus tard.</span></span>
      </button>
    </section>

    <section aria-label="Mes packs" style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 500">Mes packs</h2>
      <div style="min-height: 72px; border-radius: 16px; background: var(--sf-c); padding: 12px 16px; display: flex; align-items: center; gap: 16px">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 10px; background: var(--sf-highest); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px">SRD 5.2.1</span><span style="font-size: 12px; line-height: 16px; color: var(--on-sfv)">Toujours disponible · hors-ligne</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D3C4B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Pack verrouillé" role="img"><path d="M5 11h14v10H5z M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      </div>
      <button style="align-self: flex-start; height: 40px; padding: 0 12px; border-radius: 20px; color: var(--p); font-size: 14px; font-weight: 500">Importer un pack .dndpack</button>
    </section>
  </div>

  <nav aria-label="Navigation principale" style="flex: none; height: 80px; background: var(--sf-c); display: flex; padding: 12px 0 16px">
    <sc-for list="{{nav}}" as="r" hint-placeholder-count="5">
      <a href="#" aria-current="{{r.cur}}" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--on-sf)"><span style="width: 64px; height: 32px; border-radius: 16px; background: {{r.bg}}; color: {{r.fg}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path></svg></span><span style="font-size: 12px; line-height: 16px; font-weight: {{r.w}}">{{r.l}}</span></a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const N = [
      ['Accueil', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z'],
      ['Tables', 'M3 21h18 M5 21V8l3-2 3 2v13 M13 21V5l3-2 3 2v16'],
      ['Personnages', 'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M4 21a8 8 0 0 1 16 0'],
      ['Compendium', 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'],
      ['Homebrew', 'M9 3h6 M10 3v6L4 19a1.5 1.5 0 0 0 1.3 2h13.4a1.5 1.5 0 0 0 1.3-2L14 9V3'],
    ];
    const nav = N.map(([l, d], i) => ({ l, d, cur: i === 0 ? 'page' : 'false', bg: i === 0 ? 'var(--sc)' : 'transparent', fg: i === 0 ? 'var(--on-sc)' : 'var(--on-sfv)', w: i === 0 ? 700 : 500 }));
    return { nav };
  }
}
</script>
</body>
</html>
