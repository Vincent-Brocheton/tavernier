<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Montée de niveau — téléphone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--on-p:#00382F;--pc:#1F5047;--on-pc:#A6F2E0;--sc:#54463A;--on-sc:#F5E0C9;--t:#E7C28A;--e:#FFB4AB;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--ol:#9C8E82;--olv:#4F453C}
*{box-sizing:border-box}
.d{font-family:'Cinzel',Georgia,serif}
.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:#84D5C4}a:hover{color:#A6F2E0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="flex: none; position: relative; overflow: hidden; background: var(--sf-low)">
    <svg aria-hidden="true" width="390" height="140" style="position: absolute; inset: 0; opacity: 0.07; pointer-events: none"><filter id="gP11"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#gP11)"></rect></svg>
    <div style="position: relative; height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 4px">
      <button aria-label="Fermer" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button>
      <span style="flex: 1; font-size: 16px; font-weight: 500">Aldric · Guerrier 5 → 6</span>
      <span class="n" style="font-size: 14px; color: var(--on-sfv)">3 sur 4</span><button aria-label="Suggérer un don" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--p)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"></path></svg></button>
    </div>
    <div role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="3" aria-label="Progression" style="position: relative; height: 4px; margin: 0 16px; display: flex; gap: 4px"><div style="width: 75%; height: 4px; border-radius: 2px; background: var(--p)"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: var(--sf-highest)"></div></div>
    <div style="position: relative; padding: 12px 16px 14px">
      <h1 class="d" style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600; color: var(--t)">Choisir un don</h1>
      <div style="font-size: 12px; line-height: 16px; color: var(--on-sfv)">Amélioration de caractéristique, ou un autre don dont vous remplissez les conditions. Touchez ✦ pour une suggestion.</div>
    </div>
  </header>

  <div role="radiogroup" aria-label="Dons" style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 0 0">
    <sc-for list="{{feats}}" as="f" hint-placeholder-count="6">
      <div style="padding: 0 16px; background: {{f.bg}}">
        <button role="radio" aria-checked="{{f.on}}" aria-disabled="{{f.dis}}" style="width: 100%; min-height: 72px; padding: 10px 0; text-align: left; display: flex; align-items: center; gap: 16px; opacity: {{f.op}}">
          <span style="width: 20px; height: 20px; flex: none; border-radius: 10px; border: 2px solid {{f.ring}}; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{f.dot}}"></span></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; line-height: 22px">{{f.l}}</span><span style="font-size: 13px; line-height: 18px; color: {{f.sFg}}">{{f.s}}</span></span>
          <sc-if value="{{f.locked}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D3C4B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11h14v10H5z M8 11V7a4 4 0 0 1 8 0v4"></path></svg></sc-if>
        </button>
        <sc-if value="{{f.sel}}" hint-placeholder-val="{{false}}">
          <div style="padding: 0 0 14px 36px; display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 12px; font-weight: 500; color: var(--on-pc)">Augmentation de caractéristique (+1)</span>
            <div role="radiogroup" aria-label="Caractéristique" style="display: flex; height: 40px; border-radius: 20px; border: 1px solid var(--ol); overflow: hidden">
              <button role="radio" aria-checked="true" class="n" style="flex: 1; background: var(--sc); color: var(--on-sc); font-size: 14px; font-weight: 500">Force 18 → 19</button>
              <button role="radio" aria-checked="false" class="n" style="flex: 1; border-left: 1px solid var(--ol); font-size: 14px; font-weight: 500">Dextérité 13 → 14</button>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="flex: none; padding: 12px 16px 20px; display: flex; gap: 8px; background: var(--sf); box-shadow: 0 -1px 0 var(--olv)">
    <button style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid var(--ol); font-size: 14px; font-weight: 500; color: var(--p)">Précédent</button>
    <button style="flex: 1; height: 48px; border-radius: 24px; background: var(--p); color: var(--on-p); font-size: 14px; font-weight: 600">Suivant</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const F = [
      ['Amélioration de caractéristique', '+2 à une valeur ou +1 à deux · max 20', 'ok'],
      ['Empoigneur', 'FOR 13+ ✓ · Avantage contre une cible Agrippée', 'sel'],
      ['Doué', 'Trois maîtrises au choix', 'ok'],
      ['Initié à la magie', 'Répétable · sorts d’une liste au choix', 'ok'],
      ['Vigilant', 'Déjà obtenu par Humain (Polyvalent). Ce don n’est pas répétable.', 'ko'],
      ['Sauvagerie martiale', 'Déjà obtenu par l’Historique Soldat. Non répétable.', 'ko'],
    ];
    const feats = F.map(([l, s, st]) => {
      const sel = st === 'sel', ko = st === 'ko';
      return { l, s, sel, locked: ko, on: sel ? 'true' : 'false', dis: ko ? 'true' : 'false', op: ko ? 0.62 : 1,
        bg: sel ? 'var(--pc)' : 'transparent', ring: sel ? 'var(--p)' : 'var(--ol)', dot: sel ? 'var(--p)' : 'transparent', sFg: ko ? 'var(--e)' : sel ? 'var(--on-pc)' : 'var(--on-sfv)' };
    });
    return { feats };
  }
}
</script>
</body>
</html>
