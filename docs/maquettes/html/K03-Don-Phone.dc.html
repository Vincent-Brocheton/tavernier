<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fiche de don</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--on-p:#00382F;--pc:#1F5047;--on-pc:#A6F2E0;--sc:#54463A;--on-sc:#F5E0C9;--t:#E7C28A;--e:#FFB4AB;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--ol:#9C8E82;--olv:#4F453C;--heal:#9ED98C}
*{box-sizing:border-box}
.d{font-family:'Cinzel',Georgia,serif}
.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:#84D5C4}a:hover{color:#A6F2E0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="flex: none; position: relative; overflow: hidden; background: var(--sf-low); padding: 4px 4px 18px">
    <svg aria-hidden="true" width="390" height="170" style="position: absolute; inset: 0; opacity: 0.07; pointer-events: none"><filter id="gK03"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#gK03)"></rect></svg>
    <div style="position: relative; height: 56px; display: flex; align-items: center"><button aria-label="Retour" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M12 19l-7-7 7-7"></path></svg></button></div>
    <div style="position: relative; padding: 0 16px; display: flex; flex-direction: column; gap: 6px">
      <h1 class="d" style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600; color: var(--t)">Empoigneur</h1>
      <div style="display: flex; gap: 6px; flex-wrap: wrap"><span style="height: 24px; padding: 0 8px; border-radius: 6px; background: var(--sc); color: var(--on-sc); font-size: 12px; font-weight: 500; display: inline-flex; align-items: center">Don général</span><span style="height: 24px; padding: 0 8px; border-radius: 6px; background: var(--sf-highest); color: var(--on-sfv); font-size: 12px; font-weight: 500; display: inline-flex; align-items: center">SRD 5.2.1</span></div>
    </div>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="border-radius: 12px; background: var(--sf-c); padding: 12px 14px; font-size: 14px; line-height: 20px"><span style="color: var(--on-sfv)">Prérequis :</span> niveau 4 ou supérieur, Force ou Dextérité 13 ou plus.</div>
    <sc-for list="{{benefits}}" as="b" hint-placeholder-count="4"><p style="margin: 0; font-size: 15px; line-height: 22px"><strong style="font-weight: 600">{{b.k}}.</strong> {{b.v}}</p></sc-for>

    <section style="border-radius: 16px; background: var(--sf-c); padding: 4px 0">
      <h2 style="margin: 0; padding: 10px 16px 4px; font-size: 14px; line-height: 20px; font-weight: 500">Personnages des Marches de Brumeval</h2>
      <sc-for list="{{chars}}" as="c" hint-placeholder-count="3">
        <div style="min-height: 60px; padding: 6px 16px; display: flex; align-items: center; gap: 12px">
          <span style="width: 24px; height: 24px; flex: none; border-radius: 12px; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"></path></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px">{{c.n}}</span><span class="n" style="font-size: 12px; color: {{c.sFg}}">{{c.s}}</span></span>
        </div>
      </sc-for>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const benefits = [
      { k: 'Augmentation de caractéristique', v: '+1 en Force ou en Dextérité, jusqu’à un maximum de 20.' },
      { k: 'Frappe et empoignade', v: 'Quand vous touchez à mains nues lors de l’action Attaque, vous pouvez infliger les dégâts et agripper en même temps, une fois par tour.' },
      { k: 'Attaque avec avantage', v: 'Avantage aux attaques contre une créature que vous agrippez.' },
      { k: 'Lutteur rapide', v: 'Votre Vitesse n’est pas divisée par deux quand vous déplacez une créature agrippée de votre taille ou plus petite.' },
    ];
    const chars = [
      { n: 'Aldric Varenne', s: 'Éligible · Guerrier 5, FOR 18 · prochain don au niveau 6', bg: 'var(--heal)', fg: '#10380F', d: 'M5 12l5 5L20 7', sFg: 'var(--on-sfv)' },
      { n: 'Thalia', s: 'Éligible · Roublarde 5, DEX 18', bg: 'var(--heal)', fg: '#10380F', d: 'M5 12l5 5L20 7', sFg: 'var(--on-sfv)' },
      { n: 'Mira Solen', s: 'Non éligible : FOR 12 et DEX 10, il faut 13 dans l’une des deux', bg: 'var(--e)', fg: '#690005', d: 'M12 7v6 M12 17h.01', sFg: 'var(--e)' },
    ];
    return { benefits, chars };
  }
}
</script>
</body>
</html>
