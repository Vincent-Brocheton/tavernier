<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fiche — Compétences</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--on-p:#00382F;--pc:#1F5047;--on-pc:#A6F2E0;--sc:#54463A;--on-sc:#F5E0C9;--t:#E7C28A;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--ol:#9C8E82;--olv:#4F453C;--warn:#FFC266;--warn-c:#634000;--on-warn-c:#FFDDB0}
*{box-sizing:border-box}
.d{font-family:'Cinzel',Georgia,serif}
.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:#84D5C4}a:hover{color:#A6F2E0}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px; background: var(--sf-low)">
    <button aria-label="Retour" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M12 19l-7-7 7-7"></path></svg></button>
    <span class="d" style="flex: 1; font-size: 20px; font-weight: 600; color: var(--t)">Aldric Varenne</span>
    <span aria-label="Conflit résolu" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFC266" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4 M12 17h.01 M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg></span>
  </header>
  <nav aria-label="Onglets de la fiche" style="flex: none; height: 48px; display: flex; background: var(--sf-low); border-bottom: 1px solid var(--olv); overflow: hidden; padding-left: 8px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
      <a href="#" aria-current="{{t.cur}}" style="flex: none; height: 48px; padding: 0 14px; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: {{t.fg}}; font-size: 14px; font-weight: 500"><span style="flex: 1; display: flex; align-items: center">{{t.l}}</span><span style="height: 3px; width: 100%; border-radius: 3px 3px 0 0; background: {{t.bar}}"></span></a>
    </sc-for>
  </nav>

  <div role="status" style="flex: none; margin: 12px 16px 0; border-radius: 12px; background: var(--warn-c); color: var(--on-warn-c); padding: 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M7 18a5 5 0 0 1-.5-9.98A6 6 0 0 1 18 9a4.5 4.5 0 0 1 0 9z M12 10v3 M12 15.5h.01"></path></svg>
      <span style="font-size: 14px; line-height: 20px"><strong style="font-weight: 600">Conflit résolu à la synchronisation.</strong> Pendant votre hors-ligne, Camille a réglé vos PV en combat à <span class="n">34</span>. Votre soin (<span class="n">+5</span>) a été remplacé : en combat, la version du MJ prime.</span></div>
    <div style="display: flex; justify-content: flex-end; gap: 4px"><button style="height: 40px; padding: 0 12px; border-radius: 20px; color: var(--warn); font-size: 14px; font-weight: 500">Voir l’historique</button><button style="height: 40px; padding: 0 12px; border-radius: 20px; color: var(--warn); font-size: 14px; font-weight: 600">OK</button></div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px">
      <div style="flex: 1; height: 56px; border-radius: 12px; background: var(--sf-c); display: flex; align-items: center; justify-content: center; gap: 8px"><span class="n" style="font-size: 20px; font-weight: 600">14</span><span style="font-size: 12px; color: var(--on-sfv)">Perception passive</span></div>
      <div style="flex: 1; height: 56px; border-radius: 12px; background: var(--sf-c); display: flex; align-items: center; justify-content: center; gap: 8px"><span class="n" style="font-size: 20px; font-weight: 600">+3</span><span style="font-size: 12px; color: var(--on-sfv)">Maîtrise</span></div>
    </div>
    <div style="border-radius: 16px; background: var(--sf-c); padding: 4px 0">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="18">
        <sc-if value="{{r.head}}" hint-placeholder-val="{{false}}"><div style="padding: 10px 16px 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; color: var(--on-sfv)">{{r.l}}</div></sc-if>
        <sc-if value="{{r.item}}" hint-placeholder-val="{{true}}">
          <button style="width: 100%; min-height: 40px; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-align: left">
            <span style="width: 10px; height: 10px; border-radius: 5px; background: {{r.dot}}; border: 1.5px solid {{r.bd}}"></span>
            <span style="flex: 1; font-size: 15px; color: {{r.fg}}">{{r.l}}</span>
            <sc-if value="{{r.adv}}" hint-placeholder-val="{{false}}"><span style="height: 20px; padding: 0 6px; border-radius: 5px; background: var(--pc); color: var(--on-pc); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center">Avantage</span></sc-if>
            <span class="n" style="width: 32px; text-align: right; font-size: 15px; font-weight: 600; color: {{r.fg}}">{{r.v}}</span>
          </button>
        </sc-if>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const tabs = ['Principal', 'Compétences', 'Combat', 'Sorts', 'Inventaire', 'Aptitudes', 'Notes'].map((l, i) => ({ l, cur: i === 1 ? 'page' : 'false', fg: i === 1 ? 'var(--p)' : 'var(--on-sfv)', bar: i === 1 ? 'var(--p)' : 'transparent' }));
    const mods = { FOR: 4, DEX: 1, INT: -1, SAG: 1, CHA: 0 };
    const sgn = (m) => (m >= 0 ? '+' : '−') + Math.abs(m);
    const G = [
      ['FORCE', 'FOR', [['Athlétisme', 1, 1]]],
      ['DEXTÉRITÉ', 'DEX', [['Acrobaties'], ['Discrétion'], ['Escamotage']]],
      ['INTELLIGENCE', 'INT', [['Arcanes'], ['Histoire'], ['Investigation'], ['Nature'], ['Religion']]],
      ['SAGESSE', 'SAG', [['Dressage'], ['Intuition', 1], ['Médecine'], ['Perception', 1], ['Survie', 1]]],
      ['CHARISME', 'CHA', [['Intimidation', 1], ['Persuasion'], ['Représentation'], ['Tromperie']]],
    ];
    const rows = [];
    G.forEach(([h, k, list]) => {
      rows.push({ head: true, item: false, l: h });
      list.forEach(([l, p, adv]) => rows.push({ head: false, item: true, l, adv: !!adv, v: sgn(mods[k] + (p ? 3 : 0)), dot: p ? 'var(--p)' : 'transparent', bd: p ? 'var(--p)' : 'var(--ol)', fg: p ? 'var(--on-sf)' : 'var(--on-sfv)' }));
    });
    return { tabs, rows };
  }
}
</script>
</body>
</html>
