<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fiche envoyée — corrections demandées</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--on-p:#00382F;--pc:#1F5047;--on-pc:#A6F2E0;--sc:#54463A;--on-sc:#F5E0C9;--t:#E7C28A;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--ol:#9C8E82;--olv:#4F453C;--warn:#FFC266;--warn-c:#634000;--on-warn-c:#FFDDB0;--heal:#9ED98C;--thp:#A7C8FF}
*{box-sizing:border-box}
.d{font-family:'Cinzel',Georgia,serif}
.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:#84D5C4}a:hover{color:#A6F2E0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px; background: var(--sf-low)">
    <button aria-label="Retour" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M12 19l-7-7 7-7"></path></svg></button>
    <span style="flex: 1; font-size: 16px; font-weight: 500">Mes personnages</span>
    <span aria-label="Synchronisé" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9ED98C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a5 5 0 0 1-.5-9.98A6 6 0 0 1 18 9a4.5 4.5 0 0 1 0 9z M9.5 13.5l2 2 3.5-3.5"></path></svg></span>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; background: var(--sf)">
    <div style="position: relative; overflow: hidden; margin: 0 -16px; padding: 8px 16px 16px; background: var(--sf-low); display: flex; gap: 14px; align-items: center">
      <svg aria-hidden="true" width="390" height="110" style="position: absolute; inset: 0; opacity: 0.07; pointer-events: none"><filter id="gP09"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#gP09)"></rect></svg>
      <div class="d" style="position: relative; width: 64px; height: 64px; flex: none; border-radius: 32px; background: var(--sc); color: var(--t); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600">AV</div>
      <div style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 4px">
        <h1 class="d" style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 600; color: var(--t)">Aldric Varenne</h1>
        <span style="font-size: 14px; color: var(--on-sfv)">Humain · Guerrier 1 · Soldat</span>
        <span style="align-self: flex-start; height: 24px; padding: 0 8px 0 6px; border-radius: 6px; background: var(--warn-c); color: var(--on-warn-c); display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Corrections demandées</span>
      </div>
    </div>

    <section aria-label="Message du MJ" style="border-radius: 16px; background: var(--sf-c); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 36px; height: 36px; border-radius: 18px; background: var(--pc); color: var(--on-pc); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">C</span>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">Camille · MJ</span><span class="n" style="font-size: 12px; color: var(--on-sfv)">aujourd’hui, 21:48</span></span>
      </div>
      <p style="margin: 0; font-size: 15px; line-height: 22px">Remplace la botte « épée longue » par « épée à deux mains » : il n’y aura pas de marché avant la séance 3. Le reste est parfait.</p>
      <a href="#" style="align-self: flex-start; height: 32px; padding: 0 12px 0 8px; border-radius: 8px; border: 1px solid var(--ol); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--on-sf); text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>Étape 6 · Bottes d’armes</a>
    </section>

    <section aria-label="Historique de l’envoi" style="display: flex; flex-direction: column">
      <h2 style="margin: 0 0 8px; font-size: 14px; line-height: 20px; font-weight: 500">Suivi</h2>
      <sc-for list="{{events}}" as="e" hint-placeholder-count="4">
        <div style="display: flex; gap: 12px">
          <div style="width: 24px; display: flex; flex-direction: column; align-items: center"><span style="width: 24px; height: 24px; border-radius: 12px; background: {{e.bg}}; color: {{e.fg}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{e.d}}"></path></svg></span><span style="flex: 1; width: 2px; min-height: 16px; background: {{e.line}}"></span></div>
          <div style="flex: 1; padding-bottom: 14px"><div style="font-size: 14px; line-height: 20px">{{e.t}}</div><div class="n" style="font-size: 12px; line-height: 16px; color: var(--on-sfv)">{{e.m}}</div></div>
        </div>
      </sc-for>
    </section>
  </div>

  <div style="flex: none; padding: 12px 16px 20px; display: flex; gap: 8px; box-shadow: 0 -1px 0 var(--olv)">
    <button style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid var(--ol); font-size: 14px; font-weight: 500; color: var(--p)">Répondre</button>
    <button style="flex: 1; height: 48px; border-radius: 24px; background: var(--p); color: var(--on-p); font-size: 14px; font-weight: 600">Corriger la fiche</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const events = [
      { t: 'Corrections demandées par Camille', m: '21:48', d: 'M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z', bg: 'var(--warn)', fg: 'var(--warn-c)', line: 'var(--olv)' },
      { t: 'Reçue par le MJ', m: '21:32', d: 'M5 12l5 5L20 7', bg: 'var(--heal)', fg: '#10380F', line: 'var(--olv)' },
      { t: 'Synchronisée à la reconnexion', m: '21:31 · envoi automatique', d: 'M12 16v-5 M9.5 13.5L12 11l2.5 2.5', bg: 'var(--thp)', fg: '#0B2A55', line: 'var(--olv)' },
      { t: 'Envoyée hors-ligne, mise en file', m: '21:10 · aucune action requise', d: 'M3 3l18 18 M8 18a5 5 0 0 1-1.6-9.7', bg: 'var(--sf-highest)', fg: 'var(--on-sf)', line: 'transparent' },
    ];
    return { events };
  }
}
</script>
</body>
</html>
