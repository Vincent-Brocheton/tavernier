<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Repos court</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--on-p:#00382F;--pc:#1F5047;--on-pc:#A6F2E0;--sc:#54463A;--on-sc:#F5E0C9;--t:#E7C28A;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--ol:#9C8E82;--olv:#4F453C;--heal:#9ED98C;--heal-c:#24501C;--on-heal-c:#BAF5A6}
*{box-sizing:border-box}
.d{font-family:'Cinzel',Georgia,serif}
.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:#84D5C4}a:hover{color:#A6F2E0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column">
    <div style="height: 64px; background: var(--sf-low)"></div>
    <div style="height: 104px; background: var(--sf-low); padding: 4px 16px; display: flex; gap: 14px; align-items: center"><div style="width: 64px; height: 64px; border-radius: 32px; background: var(--sc)"></div><span class="d" style="font-size: 24px; font-weight: 600; color: var(--t)">Aldric Varenne</span></div>
    <div style="margin: 16px; height: 150px; border-radius: 16px; background: var(--sf-c)"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.5)"></div>

  <section role="dialog" aria-label="Repos court" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--sf-low); border-radius: 28px 28px 0 0; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="height: 22px; display: flex; align-items: center; justify-content: center"><span style="width: 32px; height: 4px; border-radius: 2px; background: var(--ol)"></span></div>
    <div style="display: flex; align-items: flex-end; gap: 8px">
      <div style="flex: 1"><h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 400">Repos court</h2><span style="font-size: 13px; color: var(--on-sfv)">Au moins 1 heure · il faut au moins 1 PV</span></div>
      <span class="n" style="font-size: 14px; color: var(--on-sfv)">PV <strong style="color: var(--on-sf)">31 → 41</strong> / 49</span>
    </div>
    <div style="height: 10px; border-radius: 5px; background: var(--sf-highest); overflow: hidden; display: flex"><div style="width: 63%; background: var(--heal)"></div><div style="width: 20%; background: repeating-linear-gradient(45deg, #9ED98C 0 4px, #24501C 4px 8px)"></div></div>

    <div style="border-radius: 16px; background: var(--sf-c); padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px"><span style="flex: 1; font-size: 14px; font-weight: 500">Dés de vie dépensés</span><span class="n" style="font-size: 13px; color: var(--on-sfv)">restants : 2 / 5 d10</span></div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
        <span style="width: 40px; height: 40px; border-radius: 10px; background: var(--sf-highest); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">d10</span>
        <span class="n" style="flex: 1; font-size: 16px">7 <span style="color: var(--on-sfv)">+ 3 CON</span> = <strong>10</strong></span>
        <button aria-label="Retirer ce dé" style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button>
      </div>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; height: 48px; border-radius: 24px; background: var(--sc); color: var(--on-sc); font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8.7 5v10L12 22l-8.7-5V7z M12 2v20 M3.3 7l17.4 10 M20.7 7L3.3 17"></path></svg>Lancer un dé</button>
        <button style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid var(--ol); font-size: 14px; font-weight: 500">Saisir mon jet</button>
      </div>
    </div>

    <div style="border-radius: 16px; background: var(--sf-c); padding: 4px 0">
      <span style="display: block; padding: 10px 16px 4px; font-size: 14px; font-weight: 500">Récupéré à la fin du repos</span>
      <sc-for list="{{res}}" as="r" hint-placeholder-count="2">
        <div style="min-height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 12px">
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px">{{r.l}}</span><span style="font-size: 12px; color: var(--on-sfv)">{{r.s}}</span></span>
          <span class="n" style="height: 28px; padding: 0 10px; border-radius: 8px; background: var(--heal-c); color: var(--on-heal-c); display: inline-flex; align-items: center; font-size: 13px; font-weight: 600">{{r.v}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 48px; border-radius: 24px; font-size: 14px; font-weight: 500; color: var(--p)">Annuler</button>
      <button style="flex: 2; height: 48px; border-radius: 24px; background: var(--p); color: var(--on-p); font-size: 14px; font-weight: 600">Terminer le repos court</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { res: [
      { l: 'Second souffle', s: 'Repos court : une utilisation', v: '2 → 3 / 3' },
      { l: 'Fougue', s: 'Repos court ou long', v: '0 → 1 / 1' },
    ] };
  }
}
</script>
</body>
</html>
