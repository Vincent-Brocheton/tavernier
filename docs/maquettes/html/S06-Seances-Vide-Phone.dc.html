<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Séances — premier usage (téléphone, MJ)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0;background:#1A1612}
:root{--p:#84D5C4;--on-p:#00382F;--pc:#1F5047;--on-pc:#A6F2E0;--sc:#54463A;--on-sc:#F5E0C9;--t:#E7C28A;--sf:#1A1612;--sf-low:#221E1A;--sf-c:#27221E;--sf-high:#322C28;--sf-highest:#3D3732;--on-sf:#EDE0D6;--on-sfv:#D3C4B6;--ol:#9C8E82;--olv:#4F453C}
*{box-sizing:border-box}
.d{font-family:'Cinzel',Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--sf); color: var(--on-sf); font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="position: relative; overflow: hidden; flex: none; background: #3A3550; padding: 8px 4px 0; display: flex; flex-direction: column">
    <svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; opacity: 0.16; pointer-events: none"><filter id="gS06"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#gS06)"></rect></svg>
    <div style="position: relative; display: flex; align-items: center; gap: 4px"><button aria-label="Retour" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M12 19l-7-7 7-7"></path></svg></button><span class="d" style="flex: 1; font-size: 20px; font-weight: 600; color: var(--t)">La Tour d’Hiver</span></div>
    <nav aria-label="Sections" style="position: relative; display: flex; padding-left: 8px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><a href="#" aria-current="{{t.cur}}" style="flex: none; height: 48px; padding: 0 14px; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: {{t.fg}}; font-size: 14px; font-weight: 500"><span style="flex: 1; display: flex; align-items: center">{{t.l}}</span><span style="height: 3px; width: 100%; border-radius: 3px 3px 0 0; background: {{t.bar}}"></span></a></sc-for>
    </nav>
  </header>
  <div style="flex: 1; padding: 56px 32px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
    <div aria-hidden="true" style="width: 96px; height: 96px; border-radius: 48px; background: var(--sf-c); display: flex; align-items: center; justify-content: center; color: var(--t)"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4 M9 15h6"></path></svg></div>
    <h1 class="d" style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; color: var(--t)">Aucune séance</h1>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--on-sfv)">Une séance regroupe les rencontres, les notes et les PX d’une soirée de jeu. Préparez-la sur ordinateur ou ici, elle sera jouable sans réseau.</p>
    <div style="display: flex; flex-direction: column; gap: 8px; align-self: stretch; margin-top: 12px">
      <button style="height: 48px; border-radius: 24px; background: var(--p); color: var(--on-p); font-size: 14px; font-weight: 600">Préparer la séance 1</button>
      <button style="height: 48px; border-radius: 24px; border: 1px solid var(--ol); color: var(--p); font-size: 14px; font-weight: 500">Jouer tout de suite, sans préparation</button>
    </div>
    <span style="font-size: 12px; line-height: 16px; color: var(--on-sfv); margin-top: 4px">2 joueurs sur 4 ont une fiche validée. Les autres pourront rejoindre la séance en cours.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tabs = ['Groupe', 'Séances', 'Rencontres', 'Notes'].map((l, i) => ({ l, cur: i === 1 ? 'page' : 'false', fg: i === 1 ? 'var(--t)' : 'var(--on-pc)', bar: i === 1 ? 'var(--t)' : 'transparent' }));
    return { tabs };
  }
}
</script>
</body>
</html>
